# Full-stack deployment: backend (FastAPI) + frontend (Vite build served
# via nginx, using the nginx.conf already in this repo) + a shared volume
# for the SQLite DB and FAISS/BM25 indexes so they persist across restarts.
#
# Usage:
#   docker compose up --build
#   -> frontend on http://localhost:80
#   -> backend API on http://localhost:8000
#
# For actual cloud deployment (Render, Fly.io, Railway, etc.), point the
# platform's "Docker deploy" option at this file, or build/push the
# backend image alone (it already has its own Dockerfile) and serve the
# frontend as a static build from any static host (Vercel/Netlify) with
# vite.config.js's /api proxy replaced by the deployed backend's real URL.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/uploads
      - backend_vectors:/app/vector_data
      - backend_db:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build

        FROM nginx:alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        EXPOSE 80
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_vectors:
  backend_db: